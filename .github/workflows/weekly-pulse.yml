name: Weekly Review Pulse

# Monday 09:00 Asia/Kolkata = 03:30 UTC
on:
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:
    inputs:
      skip_fetch:
        description: "Skip Play Store refresh (use committed/existing export)"
        type: boolean
        default: false
      skip_publish:
        description: "Skip Docs/Gmail MCP publish"
        type: boolean
        default: false

concurrency:
  group: weekly-review-pulse
  cancel-in-progress: false

# Push archived pulse so Railway redeploy picks up dashboard history
permissions:
  contents: write

jobs:
  weekly-pulse:
    name: Refresh → classify → report
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify required secrets
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MCP_HTTP_TOKEN: ${{ secrets.MCP_HTTP_TOKEN }}
          GOOGLE_DOC_ID: ${{ secrets.GOOGLE_DOC_ID }}
          SKIP_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_publish || false }}
        run: |
          set -euo pipefail
          if [ -z "${GROQ_API_KEY:-}" ]; then
            echo "Missing repository secret: GROQ_API_KEY"
            exit 1
          fi
          if [ "${SKIP_PUBLISH}" != "true" ]; then
            if [ -z "${MCP_HTTP_TOKEN:-}" ]; then
              echo "Missing repository secret: MCP_HTTP_TOKEN (or set skip_publish)"
              exit 1
            fi
            if [ -z "${GOOGLE_DOC_ID:-}" ]; then
              echo "Missing repository secret: GOOGLE_DOC_ID (or set skip_publish)"
              exit 1
            fi
          fi
          echo "Secrets check OK"

      - name: Write .env for the run
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PULSE_MODEL: ${{ secrets.PULSE_MODEL }}
          MCP_SERVER_URL: ${{ secrets.MCP_SERVER_URL }}
          MCP_HTTP_TOKEN: ${{ secrets.MCP_HTTP_TOKEN }}
          GOOGLE_DOC_ID: ${{ secrets.GOOGLE_DOC_ID }}
        run: |
          set -euo pipefail
          # Prefer repo secret when set; otherwise free-tier default (20B).
          # Force-migrate known-bad defaults (120B burns TPD; 8B not on free tier).
          MODEL="${PULSE_MODEL:-}"
          if [ -z "${MODEL}" ] || [ "${MODEL}" = "openai/gpt-oss-120b" ] || [ "${MODEL}" = "llama-3.1-8b-instant" ]; then
            MODEL="openai/gpt-oss-20b"
          fi
          {
            echo "GROQ_API_KEY=${GROQ_API_KEY}"
            echo "PULSE_MODEL=${MODEL}"
            echo "MCP_SERVER_URL=${MCP_SERVER_URL:-https://mcp-server-production-f0ca.up.railway.app}"
            echo "MCP_HTTP_TOKEN=${MCP_HTTP_TOKEN:-}"
            echo "GOOGLE_DOC_ID=${GOOGLE_DOC_ID:-}"
            echo "DOCS_MCP_SERVER=google-workspace"
            echo "GMAIL_MCP_SERVER=google-workspace"
            echo "LANGSMITH_TRACING=false"
          } > .env

      - name: Run weekly pulse
        env:
          SKIP_FETCH: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_fetch || false }}
          SKIP_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_publish || false }}
        run: |
          set -euo pipefail
          ARGS=()
          # schedule events have empty inputs — treat as full fetch + publish
          if [ "${SKIP_FETCH:-false}" = "true" ]; then
            ARGS+=(--skip-fetch)
          fi
          if [ "${SKIP_PUBLISH:-false}" = "true" ]; then
            ARGS+=(--skip-publish)
          fi
          python scripts/run_weekly_pulse.py "${ARGS[@]}"

      - name: Commit pulse history for dashboard
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Only dashboard-facing files (tracked via .gitignore exceptions)
          git add \
            data/artifacts/pulse.json \
            data/artifacts/pulse.md \
            data/artifacts/history/ \
            data/state/doc_registry.json || true

          if git diff --cached --quiet; then
            echo "No pulse history changes to commit"
            exit 0
          fi

          WEEK=$(python -c "import json; print(json.load(open('data/artifacts/pulse.json'))['week_ending'])" 2>/dev/null || echo "unknown")
          git commit -m "Archive weekly pulse ${WEEK} for dashboard"
          # Rebase if main moved; avoid force-push
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "Pushed pulse history — Railway should redeploy with week ${WEEK}"

      - name: Redeploy Railway dashboard
        if: success()
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
        run: |
          set -euo pipefail
          if [ -n "${RAILWAY_API_TOKEN:-}" ]; then
            export RAILWAY_TOKEN="${RAILWAY_API_TOKEN}"
          fi
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "RAILWAY_TOKEN not set — skipping dashboard redeploy"
            exit 0
          fi
          npm install -g @railway/cli@5.2.0
          ARGS=(up -y --detach -m "Weekly pulse dashboard ${GITHUB_SHA}")
          if [ -n "${RAILWAY_PROJECT_ID:-}" ]; then
            ARGS+=(--project "${RAILWAY_PROJECT_ID}")
          fi
          if [ -n "${RAILWAY_ENVIRONMENT_ID:-}" ]; then
            ARGS+=(--environment "${RAILWAY_ENVIRONMENT_ID}")
          fi
          if [ -n "${RAILWAY_SERVICE_ID:-}" ]; then
            ARGS+=(--service "${RAILWAY_SERVICE_ID}")
          fi
          railway "${ARGS[@]}"
          echo "Railway deploy triggered"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-pulse-${{ github.run_id }}
          path: |
            data/artifacts/
            data/state/doc_registry.json
            data/exports/groww_play_reviews.csv
          if-no-files-found: warn
          retention-days: 30
