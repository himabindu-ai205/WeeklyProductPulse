<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Review Pulse — Groww</title>
  <meta name="description" content="Weekly Play Store review intelligence: themes, quotes, and actions for Groww.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            "surface-container": "#f4ece8",
            "on-secondary-container": "#67625b",
            "surface-container-highest": "#e9e1dd",
            "on-primary-fixed-variant": "#7e2c0e",
            "surface-container-low": "#faf2ee",
            "outline-variant": "#dcc1b8",
            background: "#fff8f5",
            surface: "#fff8f5",
            "tertiary-container": "#7a746b",
            "on-error-container": "#93000a",
            "on-background": "#1e1b19",
            "surface-tint": "#9d4324",
            "secondary-fixed-dim": "#cdc5bd",
            "on-secondary-fixed": "#1f1b16",
            "on-surface": "#1e1b19",
            "surface-variant": "#e9e1dd",
            "on-secondary": "#ffffff",
            "tertiary-fixed-dim": "#cec5bb",
            "surface-bright": "#fff8f5",
            "error-container": "#ffdad6",
            "on-primary-container": "#fffbff",
            "primary-fixed": "#ffdbd0",
            tertiary: "#615b53",
            "surface-dim": "#e0d8d5",
            "inverse-surface": "#33302d",
            "on-error": "#ffffff",
            "inverse-primary": "#ffb59d",
            primary: "#9a4021",
            "tertiary-fixed": "#eae1d7",
            "on-tertiary-fixed": "#1f1b15",
            error: "#ba1a1a",
            "on-surface-variant": "#56423c",
            outline: "#89726b",
            "on-tertiary": "#ffffff",
            "on-tertiary-fixed-variant": "#4b463e",
            "secondary-fixed": "#eae1d9",
            "on-primary": "#ffffff",
            "primary-container": "#b95837",
            "inverse-on-surface": "#f7efeb",
            "surface-container-lowest": "#ffffff",
            "on-primary-fixed": "#390b00",
            "on-secondary-fixed-variant": "#4b4640",
            "surface-container-high": "#eee7e3",
            "secondary-container": "#e7ded6",
            secondary: "#635d57",
            "on-tertiary-container": "#fffbff",
            "primary-fixed-dim": "#ffb59d",
          },
          borderRadius: { DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px" },
          spacing: {
            "space-sm": "0.75rem",
            "space-xl": "2rem",
            "space-2xl": "3rem",
            "card-padding": "1.5rem",
            "space-xs": "0.5rem",
            "space-2xs": "0.25rem",
            "space-md": "1rem",
            "container-max-width": "900px",
            "space-lg": "1.5rem",
          },
          fontFamily: {
            "body-lg": ["DM Sans"],
            "display-title": ["Lora"],
            "metric-md": ["DM Sans"],
            "body-sm": ["DM Sans"],
            "headline-md": ["DM Sans"],
            "headline-sm": ["DM Sans"],
            "label-sm": ["DM Sans"],
            "label-md": ["DM Sans"],
            "headline-lg": ["DM Sans"],
            "body-md": ["DM Sans"],
            "metric-xl": ["DM Sans"],
          },
          fontSize: {
            "body-lg": ["1.125rem", { lineHeight: "1.75rem", letterSpacing: "-0.01em", fontWeight: "400" }],
            "display-title": ["2.25rem", { lineHeight: "2.75rem", letterSpacing: "-0.02em", fontWeight: "400" }],
            "metric-md": ["1.75rem", { lineHeight: "2rem", letterSpacing: "-0.02em", fontWeight: "700" }],
            "body-sm": ["0.8125rem", { lineHeight: "1.25rem", letterSpacing: "0.01em", fontWeight: "400" }],
            "headline-md": ["1.25rem", { lineHeight: "1.75rem", letterSpacing: "-0.01em", fontWeight: "600" }],
            "headline-sm": ["1rem", { lineHeight: "1.5rem", letterSpacing: "0em", fontWeight: "600" }],
            "label-sm": ["0.6875rem", { lineHeight: "0.875rem", letterSpacing: "0.06em", fontWeight: "600" }],
            "label-md": ["0.8125rem", { lineHeight: "1rem", letterSpacing: "0.04em", fontWeight: "600" }],
            "headline-lg": ["1.75rem", { lineHeight: "2.25rem", letterSpacing: "-0.02em", fontWeight: "600" }],
            "body-md": ["0.9375rem", { lineHeight: "1.5rem", letterSpacing: "0em", fontWeight: "400" }],
            "metric-xl": ["2.5rem", { lineHeight: "2.75rem", letterSpacing: "-0.03em", fontWeight: "700" }],
          },
        },
      },
    };
  </script>
</head>
<body class="bg-surface font-body-md text-on-surface antialiased min-h-screen flex flex-col">
  <a class="skip-link" href="#report">Skip to report</a>

  <header class="fixed top-0 left-0 right-0 z-50 bg-surface/85 backdrop-blur-md border-b border-[rgba(90,75,60,0.08)]">
    <div class="max-w-container-max-width mx-auto h-16 px-space-md lg:px-space-lg flex items-center justify-between">
      <div class="flex items-center gap-space-sm min-w-0">
        <div class="w-7 h-7 rounded-lg bg-[#00D09C] flex items-center justify-center text-white font-headline-sm text-headline-sm font-bold shrink-0">G</div>
        <span class="font-headline-sm text-headline-sm text-on-surface font-semibold tracking-tight">Groww</span>
        <span class="text-outline-variant font-body-sm text-body-sm">/</span>
        <span class="font-label-md text-label-md text-on-surface-variant font-medium tracking-wide uppercase">Product Pulse</span>
      </div>
    </div>
  </header>

  <main id="app" class="w-full pt-16 flex-1 bg-surface"></main>

  <footer class="w-full bg-surface-container-low/60 border-t border-[rgba(90,75,60,0.08)] py-space-lg">
    <div class="max-w-container-max-width mx-auto px-space-md lg:px-space-lg flex flex-col sm:flex-row items-center justify-between gap-space-xs text-center sm:text-left">
      <p id="footer-line" class="font-body-sm text-body-sm text-on-surface-variant font-normal">Weekly Review Pulse · Groww Customer Voice</p>
      <span id="footer-meta" class="font-label-sm text-label-sm text-secondary tracking-wide"></span>
    </div>
  </footer>

  <div id="draft-modal" class="popup-overlay hidden fixed inset-0 z-[60] flex items-center justify-center p-space-md bg-on-surface/20 backdrop-blur-[2px]" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="relative w-full max-w-[440px] bg-[#FDFBF7] rounded-[16px] p-space-xl flex flex-col items-center text-center border border-[rgba(90,75,60,0.12)]">
      <button type="button" id="btn-close-x" class="absolute top-space-md right-space-md w-8 h-8 rounded-full flex items-center justify-center text-secondary hover:text-on-surface hover:bg-surface-container-high" aria-label="Close dialog">
        <span class="material-symbols-outlined text-[20px]">close</span>
      </button>
      <div class="w-12 h-12 rounded-full flex items-center justify-center mb-space-md bg-[rgba(61,140,92,0.12)] text-[#3D8C5C]" aria-hidden="true">
        <span class="material-symbols-outlined text-[26px]">check_circle</span>
      </div>
      <h2 id="modal-title" class="font-headline-md text-[22px] leading-tight font-bold text-[#1A1715] mb-space-xs tracking-tight">Draft created</h2>
      <p id="modal-description" class="font-body-md text-body-md text-on-surface-variant mb-space-xs font-normal max-w-[340px]"></p>
      <p class="font-body-sm text-body-sm text-secondary mb-space-xl leading-relaxed max-w-[320px]">Opens a draft in your mail client. Nothing is sent until you send it.</p>
      <button type="button" id="btn-done" class="w-full py-2.5 px-6 rounded-full bg-[#C96442] text-white font-headline-sm text-headline-sm font-medium hover:opacity-95 active:scale-[0.98] transition-all">Done</button>
    </div>
  </div>

  <script src="/js/app.js" defer></script>
</body>
</html>
